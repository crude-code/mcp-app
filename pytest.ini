[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
asyncio_mode = auto
markers =
    db: tests that hit the real EI_DB_URL (skipped without it)
    anthropic: tests that call the Anthropic API (skipped without ANTHROPIC_API_KEY)
    network: hits live external APIs; manual run only
