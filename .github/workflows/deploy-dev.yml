name: Deploy to dev

# Dev twin of deploy.yml: runs on every push to dev and deploys the dev MCP
# server (crudecode-mcp-dev on port 9001, behind mcp-dev.crudecode.dev) via
# AWS SSM — no inbound SSH, no long-lived keys: the runner assumes an IAM role
# through GitHub OIDC and tells the SSM agent already running on the EC2 to
# run deploy-dev.sh. Port 22 stays locked to admin IPs.
on:
  push:
    branches: [dev]
  workflow_dispatch:        # manual "Run workflow" button (re-deploy / re-run)

# Never run two dev deploys at once; queue them instead of racing.
concurrency:
  group: dev-deploy
  cancel-in-progress: false

permissions:
  id-token: write           # required to mint the OIDC token used to assume the role
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      AWS_REGION: us-east-1
      INSTANCE_ID: i-02079850579ca9ebb
    steps:
      - name: Configure AWS credentials (OIDC, no stored keys)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Deploy via SSM RunShellScript
        run: |
          set -euo pipefail

          # Run deploy-dev.sh as the ubuntu user (SSM runs as root by default).
          cat > params.json <<'JSON'
          {
            "commands": [
              "sudo -u ubuntu -H bash -lc 'cd /home/ubuntu/crudecode-dev && git fetch --quiet origin dev && git reset --hard origin/dev && ./deploy-dev.sh'"
            ]
          }
          JSON

          CMD_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "GHA dev deploy ${GITHUB_SHA::7}" \
            --parameters file://params.json \
            --query 'Command.CommandId' --output text)
          echo "SSM CommandId: $CMD_ID"

          # Wait for a terminal state (waiter exits non-zero on Failed/TimedOut).
          set +e
          aws ssm wait command-executed --command-id "$CMD_ID" --instance-id "$INSTANCE_ID"
          set -e

          STATUS=$(aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" --query 'Status' --output text)
          echo "::group::deploy stdout"
          aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" --query 'StandardOutputContent' --output text
          echo "::endgroup::"
          echo "::group::deploy stderr"
          aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" --query 'StandardErrorContent' --output text
          echo "::endgroup::"

          echo "Final SSM status: $STATUS"
          [ "$STATUS" = "Success" ]
