name: Deploy to production

# Runs ONLY after a merge to main (never on pull_request), so it executes in the
# trusted base-repo context. Deploys via AWS SSM — no inbound SSH, no long-lived
# keys: the runner assumes an IAM role through GitHub OIDC and tells the SSM agent
# already running on the EC2 to run deploy.sh. Port 22 stays locked to admin IPs.
on:
  push:
    branches: [main]
  workflow_dispatch:        # manual "Run workflow" button (re-deploy / re-run)

# Never run two production deploys at once; queue them instead of racing.
concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  id-token: write           # required to mint the OIDC token used to assume the role
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      AWS_REGION: us-east-1
      INSTANCE_ID: ${{ vars.INSTANCE_ID }}
    steps:
      - name: Configure AWS credentials (OIDC, no stored keys)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Deploy via SSM RunShellScript
        run: |
          set -euo pipefail

          # Run deploy.sh as the ubuntu user (SSM runs as root by default).
          cat > params.json <<'JSON'
          {
            "commands": [
              "sudo -u ubuntu -H bash -lc 'cd /home/ubuntu/crudecode && git fetch --quiet origin main && git reset --hard origin/main && ./deploy.sh'"
            ]
          }
          JSON

          CMD_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "GHA deploy ${GITHUB_SHA::7}" \
            --parameters file://params.json \
            --query 'Command.CommandId' --output text)
          echo "SSM CommandId: $CMD_ID"

          # Wait for a terminal state (waiter exits non-zero on Failed/TimedOut).
          set +e
          aws ssm wait command-executed --command-id "$CMD_ID" --instance-id "$INSTANCE_ID"
          set -e

          STATUS=$(aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" --query 'Status' --output text)
          echo "::group::deploy stdout"
          aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" --query 'StandardOutputContent' --output text
          echo "::endgroup::"
          echo "::group::deploy stderr"
          aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" --query 'StandardErrorContent' --output text
          echo "::endgroup::"

          echo "Final SSM status: $STATUS"
          [ "$STATUS" = "Success" ]

      # Post the outcome to the crude-code Slack channel (SLACK_WEBHOOK_URL
      # repo secret). always() so failed deploys ping too.
      - name: Notify Slack
        if: always()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          JOB_STATUS: ${{ job.status }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          EMOJI="✅"; [ "$JOB_STATUS" = "success" ] || EMOJI="❌"
          TEXT="$EMOJI *prod* deploy \`${GITHUB_SHA::7}\` — $JOB_STATUS"
          [ -n "$COMMIT_MSG" ] && TEXT="$TEXT"$'\n'"${COMMIT_MSG%%$'\n'*}"
          TEXT="$TEXT"$'\n'"<$RUN_URL|view run>"
          jq -n --arg text "$TEXT" '{text: $text}' \
            | curl -s -X POST -H 'Content-type: application/json' -d @- "$SLACK_WEBHOOK_URL"
