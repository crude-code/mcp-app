server {
    server_name crudecode.dev www.crudecode.dev;

    # Static frozen files, content-addressed: the deal-sheet template
    # (deal-sheet-<sha12>.jsx) and every skill supporting file
    # (skill-<sha12>-<name>), published by the mcp-app deploy scripts — see
    # the "publish" blocks in deploy.sh / deploy-dev.sh. Served from the apex on purpose:
    # claude.ai sandbox egress allowlists that cover crudecode.dev don't
    # extend to the mcp subdomains. Immutable caching is safe because the
    # filename is the content hash.
    location /templates/ {
        alias /var/www/cc-templates/;
        default_type text/plain;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Sandbox-facing dynamic lanes (dataroom uploads, kit persists, CSV
    # exports), proxied through the apex so ONE egress allowlist entry —
    # crudecode.dev — covers every platform interaction; same rationale as
    # /templates/ above. Tokens in the URL carry identity; no slug header.
    # Upload settings mirror the mcp vhost's /upload/ block. Prod lanes
    # route to :9000; the /dev/-prefixed twins route to :9001 with the
    # prefix stripped — each server's tokens live in its own process
    # memory, so the path must pick the exact backend that minted them.
    # Servers mint these apex URLs only when CC_UPLOAD_BASE_URL is set in
    # their .env (prod: https://crudecode.dev, dev: https://crudecode.dev/dev).
    location /upload/ {
        proxy_pass http://127.0.0.1:9000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        client_max_body_size 600m;
        proxy_request_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
    location /dev/upload/ {
        rewrite ^/dev(/.*)$ $1 break;
        proxy_pass http://127.0.0.1:9001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        client_max_body_size 600m;
        proxy_request_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
    location /export/ {
        proxy_pass http://127.0.0.1:9000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 600s;
    }
    location /dev/export/ {
        rewrite ^/dev(/.*)$ $1 break;
        proxy_pass http://127.0.0.1:9001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 600s;
    }

    location / {
        proxy_pass http://127.0.0.1:4321;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/crudecode.dev/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/crudecode.dev/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot


}
server {
    if ($host = www.crudecode.dev) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = crudecode.dev) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    server_name crudecode.dev www.crudecode.dev;

    listen 80;
    return 404; # managed by Certbot




}