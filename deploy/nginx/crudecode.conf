# Crude Code MCP server
server {
    server_name mcp.crudecode.dev;

    # Per-user MCP endpoint (/{slug}/mcp) — strips slug prefix, forwards as X-User-Slug header
    location ~ ^/([a-zA-Z0-9_-]+)/mcp$ {
        set $user_slug $1;
        rewrite ^/[a-zA-Z0-9_-]+/(.*)$ /$1 break;
        proxy_pass http://127.0.0.1:9000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-User-Slug $user_slug;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # MCP endpoint (anonymous)
    location /mcp {
        proxy_pass http://127.0.0.1:9000/mcp;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/mcp.crudecode.dev/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/mcp.crudecode.dev/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}

# Crude Code signup site
server {
    server_name crudecode.dev;
    location / {
        proxy_pass http://127.0.0.1:8890;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/crudecode.dev/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/crudecode.dev/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}

# www → apex redirect
server {
    listen 80;
    server_name www.crudecode.dev;
    return 301 https://crudecode.dev$request_uri;
}

server {
    if ($host = crudecode.dev) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name crudecode.dev;
    return 404; # managed by Certbot


}
server {
    if ($host = mcp.crudecode.dev) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name mcp.crudecode.dev;
    return 404; # managed by Certbot


}