# Crude Code MCP DEV server (mcp-dev.crudecode.dev → 127.0.0.1:9001)
#
# Mirrors deploy/nginx/crudecode.conf for the prod MCP server, but routed
# to the dev systemd service (crudecode-mcp-dev) on port 9001.
#
# First-run setup (HTTP-only) gets certbot to issue a cert; certbot's
# --nginx plugin will then inject the listen 443 / ssl_certificate stanzas
# back into this file, at which point we copy the modified file back into
# the repo and commit it. Future deploys then have a clean cmp/no-op.

server {
    server_name mcp-dev.crudecode.dev;

    location ~ ^/([a-zA-Z0-9_-]+)/mcp$ {
        set $user_slug $1;
        rewrite ^/[a-zA-Z0-9_-]+/(.*)$ /$1 break;
        proxy_pass http://127.0.0.1:9001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-User-Slug $user_slug;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /mcp {
        proxy_pass http://127.0.0.1:9001/mcp;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Bulk upload lane — mirrors the prod block in crudecode-mcp.conf; see
    # the comment there. Token-in-URL carries identity; no slug header.
    location /upload/ {
        proxy_pass http://127.0.0.1:9001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        client_max_body_size 600m;
        proxy_request_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # Download lane — mirrors the prod block in crudecode-mcp.conf.
    location /export/ {
        proxy_pass http://127.0.0.1:9001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/mcp-dev.crudecode.dev/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/mcp-dev.crudecode.dev/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}


server {
    if ($host = mcp-dev.crudecode.dev) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    server_name mcp-dev.crudecode.dev;

    listen 80;
    return 404; # managed by Certbot


}
