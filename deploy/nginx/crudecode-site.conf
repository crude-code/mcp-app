server {
    server_name crudecode.dev www.crudecode.dev;

    # Static artifact templates, content-addressed (deal-sheet-<sha12>.jsx),
    # published by the mcp-app deploy scripts — see "deal-sheet template
    # publish" in deploy.sh / deploy-dev.sh. Served from the apex on purpose:
    # claude.ai sandbox egress allowlists that cover crudecode.dev don't
    # extend to the mcp subdomains. Immutable caching is safe because the
    # filename is the content hash.
    location /templates/ {
        alias /var/www/cc-templates/;
        default_type text/plain;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://127.0.0.1:4321;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    # TLS (listen 443 + certs) is managed on the host, as with the existing site.

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/crudecode.dev/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/crudecode.dev/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot


}
server {
    if ($host = www.crudecode.dev) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = crudecode.dev) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    server_name crudecode.dev www.crudecode.dev;

    listen 80;
    return 404; # managed by Certbot




}