server {
    server_name mcp.crudecode.dev;

    location ~ ^/([a-zA-Z0-9_-]+)/mcp$ {
        set $user_slug $1;
        rewrite ^/[a-zA-Z0-9_-]+/(.*)$ /$1 break;
        proxy_pass http://127.0.0.1:9000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-User-Slug $user_slug;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        chunked_transfer_encoding on;
    }

    location /mcp {
        proxy_pass http://127.0.0.1:9000/mcp;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        chunked_transfer_encoding on;
    }

    # Bulk upload lane (persist kits now, dataroom zips later). No slug in
    # the path and no X-User-Slug header on purpose: the one-time token in
    # the URL carries identity (server/upload_tokens.py). Body cap sized for
    # room zips; per-route caps are enforced again in the app.
    location /upload/ {
        proxy_pass http://127.0.0.1:9000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        client_max_body_size 600m;
        proxy_request_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # Download lane (server/exports.py). Same token-carries-identity rule as
    # /upload/, but the client here is a user's browser following a link
    # Claude printed, so responses stream unbuffered and the read timeout
    # covers assembling a large CSV from the run record.
    location /export/ {
        proxy_pass http://127.0.0.1:9000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/crudecode.dev/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/crudecode.dev/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}
server {
    if ($host = mcp.crudecode.dev) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name mcp.crudecode.dev;
    return 404; # managed by Certbot


}